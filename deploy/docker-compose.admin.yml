# LAN-only admin access overlay.
#
# The API publishes no host port in the base stack — it is reachable only inside the compose
# network. This overlay additionally publishes it on the LAN so the owner can open the admin
# dashboard from a home-network browser. It binds to all interfaces on :8080 — put the box on a
# trusted VLAN, or change the mapping to a specific LAN IP. UFW does not filter it (Docker's DNAT
# runs first); only the router's port forwards keep it off the internet.
#
# The admin routes require basic-auth (ADMIN_USER/ADMIN_PASSWORD, fail-closed). Their guard's second
# check — rejecting Cloudflare's CF-Connecting-IP header — proves nothing now that there is no tunnel,
# and is due to become a source-address check (docs/plans/public-access.md §2).
#
# Usage (deploy.sh rolls out without this overlay, so a deploy closes :8080 again):
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml -f docker-compose.admin.yml up -d
# Then browse (optionally publish `aartfileserver.local` via avahi/mDNS):
#   http://<box-lan-ip>:8080/api/admin/dashboard
services:
  api:
    ports:
      - "8080:3000"   # LAN-only admin access; never forward this port on the router
