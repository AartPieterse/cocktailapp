# Barkaart self-host stack: API + locked-down MongoDB. The Caddy `web` service that serves the SPA
# lives in docker-compose.lan.yml, the overlay the box runs.
#
#   cd deploy && cp .env.example .env   # fill in real secrets
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# Nothing in this file publishes a host port: Mongo is unreachable from the host/LAN, and the API is
# reachable only inside this network. Caddy's :80 (docker-compose.lan.yml) is the one way in.
# Pin the project name. Compose otherwise derives it from the directory, which is `deploy` — generic
# enough to collide with any other stack on the same host, and it prefixes the volume and network too.
name: barkaart

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: barkaart-api:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # JWT_SECRET, JWT_REFRESH_SECRET, JWT_ACCESS_EXPIRES, JWT_REFRESH_EXPIRES, CORS_ORIGIN come
    # from .env; MONGODB_URI is assembled from the Mongo credentials below.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin"
    expose:
      - "3000"        # internal-only; reachable from this network (Caddy), not from the host
    networks:
      - internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Root credentials enable auth automatically; --auth is explicit belt-and-suspenders.
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"       # NEVER published to the host (see docker-compose.seed.yml for one-time seeding)
    networks:
      - internal
    # mongosh is a Node program: every check burns a core for a moment. Once a minute is plenty for a
    # box this quiet; start_interval keeps startup fast, so `api` (service_healthy) isn't held back.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 5s

volumes:
  mongo-data:

networks:
  internal:
    driver: bridge
