# LAN preview overlay: serve the SPA on http://<box-lan-ip>/ with no accounts and no API.
#
#   cd deploy
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build web
#
# `web` is the barkaart-web image: Caddy with the production SPA and Caddyfile.lan baked in
# (frontend/Dockerfile). On the box, deploy.sh pulls the CI-built image for a release instead of
# building it, so nothing here mounts a host directory — the image is the whole release.
#
# Caveat worth knowing before you judge the result: over plain HTTP this is not a secure context, so
# the service worker silently does not register — no install-to-homescreen, no offline. main.ts
# swallows that failure. The app itself works fully; only the PWA layer is absent. TLS
# (docs/plans/public-access.md step 1) is what brings it back.
services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: barkaart-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  caddy-data:
  caddy-config:
