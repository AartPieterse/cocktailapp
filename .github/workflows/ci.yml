name: CI

# Guard the release path, and publish the release.
#
# Production is self-hosted: the box at home runs the whole application, and nothing is uploaded to
# a third-party host. A release is one commit on main, published as two images on GHCR tagged with
# its SHA — barkaart-api, and barkaart-web (the SPA baked into Caddy). The box pulls both and builds
# nothing (deploy/auto-deploy.sh). The frontend build in the `build` job is the gate that runs on
# every PR; the web image rebuilds it from the same commit.
#
#   PR into main / push to development -> build + verify (gate)
#   push to main (merged PR)           -> build + verify, then push both images to GHCR
on:
  pull_request:
    branches: [main]
  push:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build:shared

      - name: Shared unit tests
        run: npm test --workspace @cocktailapp/shared

      - name: Validate the frozen seed (ids, enums, refs, determinism)
        run: npm run validate:seed

      - name: Regenerate catalog and verify the generated artifacts are committed
        run: |
          npm run build:catalog
          # Stage first so the check also catches an UNTRACKED bundle (a forgotten `git add`),
          # not just modifications to already-tracked files (`git diff` alone ignores untracked).
          # catalog-ids.lock.json rides along: it is the baseline validate-seed uses to tell an
          # intentional (tombstoned) removal from one that silently strands stored cabinets.
          bundles="frontend/public/catalog.json frontend/public/catalog.nl.json catalog-ids.lock.json"
          git add -A -- $bundles
          git diff --cached --exit-code -- $bundles \
            || { echo "::error::catalog bundles are out of date or uncommitted — run 'npm run build:catalog' and commit frontend/public/catalog.json, frontend/public/catalog.nl.json and catalog-ids.lock.json."; exit 1; }

      # The Dutch overlay source is a FOURTH generated artifact. It must run after build:catalog:
      # the harvester reads the freshly built catalog.json to learn which ids and variation keys
      # exist (scripts/build-translations-nl.mjs). Without this gate, hand-written Dutch text
      # survives only until someone regenerates — which is how the caipirinha variation string
      # sat one `npm run build:translations` away from disappearing.
      - name: Verify the Dutch overlay source is up to date
        run: npm run build:translations -- --check

      # The glass artwork is generated code with real invariants — no two drinks may
      # render as the same picture, a drink must render byte-identically every time,
      # and the authored art table must not drift away from the catalog. None of
      # that is caught by `ng build`, so the specs run here or they run nowhere.
      - name: Frontend unit tests
        run: npm test --workspace frontend

      - name: Build frontend (production)
        run: npm run build --workspace frontend

      - name: Build backend
        run: npm run build --workspace backend

      - name: Backend unit tests
        run: npm test --workspace backend

  image:
    # Build the two release images and push them to GHCR (Part F / Phase 11), tagged with the git SHA
    # — immutable, and the only tag the box deploys or rolls back to — and `latest` for humans. The
    # box PULLS them: deploy/auto-deploy.sh waits until both `:<sha>` tags exist, then deploy.sh rolls
    # them out. Only after a green build on main.
    #
    # The box pulls anonymously, so both packages must be public. A package's first push can leave it
    # private: check barkaart-web's visibility on GitHub after the first run of this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the registry namespace (GHCR requires lowercase)
        id: repo
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.prefix }}/barkaart-api:${{ github.sha }}
            ${{ steps.repo.outputs.prefix }}/barkaart-api:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push the web image (SPA + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.prefix }}/barkaart-web:${{ github.sha }}
            ${{ steps.repo.outputs.prefix }}/barkaart-web:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
